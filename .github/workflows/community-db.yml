name: Community database

# Rebuilds the community camera database from Lufop.net every Sunday and commits the result.
# Pages redeploys on the commit, and the app notices the new file on its next weekly check.
# The manifest changes on every run even when the data has not, so a commit always lands:
# GitHub disables the schedule of a public repository that sees no activity for 60 days.
on:
  schedule:
    - cron: "30 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A short dataset stops here, and the published files stay as they were. A failed fetch
      # builds from the committed copy of the archive instead, when there is one.
      - name: Build
        run: python3 community-db/build.py --fallback community-db/source/lufop-eu.zip

      - name: Commit
        run: |
          git add community-db/gb-cameras.zip community-db/manifest.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          date=$(python3 -c "import json; print(json.load(open('community-db/manifest.json'))['dataDate'][:10])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(community-db): Lufop.net data of $date"
          git push
